version: 1
id: influxdb-write-failure
description: InfluxDB becomes unhealthy and successful writes stop.
phases:
  - id: normal
    duration_seconds: 120
  - id: write-failure
    duration_seconds: 180
    effects:
      counter_rate_multipliers:
        influx_lines_written_total: 0
        influx_write_success_total: 0
        influx_write_duration_seconds_sum: 0
        influx_write_duration_seconds_count: 0
        wal_forwarder_committed_total: 0
      counter_rate_additions:
        influx_write_failed_total: 0.5
        wal_forwarder_retry_total: 0.5
        wal_forwarder_commit_retry_total: 0.1
        wal_forwarder_drop_total: 0.05
      services:
        influxdb:
          status: running
          health: unhealthy
          restart_count: 0
      service_logs:
        influxdb:
          - ERROR simulated write failure
  - id: recovery
    duration_seconds: 120

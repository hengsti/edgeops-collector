version: 1
id: ingestion-backpressure
description: The ingestion queue grows because consumers cannot keep up with producers.
phases:
  - id: normal
    duration_seconds: 120
  - id: overloaded
    duration_seconds: 180
    effects:
      counter_rate_multipliers:
        ingest_messages_enqueued_total: 3
        ingest_messages_processed_total: 0.4
        ingest_sensor_messages_processed_total: 0.4
        ingest_status_messages_processed_total: 0.4
      counter_rate_additions:
        ingest_queue_full_total: 1
      service_logs:
        ingestion-service:
          - WARN queue backpressure detected
  - id: recovery
    duration_seconds: 120
    effects:
      counter_rate_multipliers:
        ingest_messages_processed_total: 2
        ingest_sensor_messages_processed_total: 2
        ingest_status_messages_processed_total: 2
        ingest_transform_success_total: 2
        influx_lines_written_total: 2
        influx_write_success_total: 2
        ingest_pipeline_duration_seconds_sum: 2
        ingest_pipeline_duration_seconds_count: 2

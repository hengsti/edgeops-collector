[project]
name = "edgeops-collector"
version = "0.1.0"
description = "Configurable production and simulation collector for EdgeOps AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "prometheus-client>=0.21,<1",
    "pyyaml>=6.0,<7",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    # FastAPI/Starlette TestClient uses httpx2 when it is installed.
    "httpx2>=2.5,<3",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "types-docker>=7.1,<8",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
edgeops-collector = "edgeops_collector.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeops_collector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["edgeops_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"

[tool.coverage.run]
source = ["edgeops_collector"]
branch = true

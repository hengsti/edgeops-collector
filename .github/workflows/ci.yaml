name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: cp .env.example .env
      - run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 90
      # compose.yaml only exposes 8095 on the Compose network, so probe from inside the container.
      - run: docker compose exec -T edgeops-collector python - < scripts/container_contract.py
      - name: Verify non-root runtime user
        run: test "$(docker compose exec -T edgeops-collector id -u)" = "10001"
      - if: always()
        run: docker compose down --volumes
